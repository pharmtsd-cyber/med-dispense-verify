<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>藥品調劑檢核系統 - 首頁</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <span class="navbar-brand">藥品調劑檢核系統</span>
      <div class="d-flex text-white" id="user-info"></div>
    </div>
  </nav>

  <div class="container mt-4">
    <!-- 三大核心功能選單 -->
    <div class="row mb-4 g-3">
      <div class="col-md-4">
        <a href="application.html" class="btn btn-outline-primary w-100 py-4 fs-4 fw-bold shadow-sm">📝 填寫申請單</a>
      </div>
      <div class="col-md-4">
        <a href="drug_workspace.html" class="btn btn-outline-success w-100 py-4 fs-4 fw-bold shadow-sm">💊 藥品調劑中心</a>
      </div>
      <div class="col-md-4">
        <a href="drug_manage.html" class="btn btn-outline-secondary w-100 py-4 fs-4 fw-bold shadow-sm">⚙️ 藥品主檔維護</a>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-header bg-white"><h5 class="mb-0">系統公告與狀態</h5></div>
      <div class="card-body">
        <p>歡迎使用系統，請選擇上方功能進行作業。</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const userStr = sessionStorage.getItem("currentUser");
      if (!userStr) {
        alert("請先登入！");
        window.location.href = "index.html";
        return;
      }
      const user = JSON.parse(userStr);
      document.getElementById("user-info").innerText = `👤 ${user.name} (${user.role})`;
    });
  </script>
</body>
</html>
