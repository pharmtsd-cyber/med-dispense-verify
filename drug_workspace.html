<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>藥品調劑中心</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .nav-tabs .nav-link.active { font-weight: bold; background-color: #e9ecef; }
  </style>
</head>
<body class="bg-light">
  <div class="container-fluid mt-4 px-4">
    <div class="d-flex justify-content-between mb-3">
      <h3>💊 藥品調劑中心 (各藥品獨立工作區)</h3>
      <a href="dashboard.html" class="btn btn-secondary">返回首頁</a>
    </div>

    <!-- 動態頁籤標題區 (由 JS 生成) -->
    <ul class="nav nav-tabs mb-3" id="drugTabs" role="tablist">
      <!-- 例如: <li class="nav-item"><button>Remdesivir</button></li> -->
    </ul>

    <!-- 動態頁籤內容區 (由 JS 生成) -->
    <div class="tab-content" id="drugTabContent">
      <div class="text-center mt-5" id="loading-msg">
        <div class="spinner-border text-primary" role="status"></div>
        <h5 class="mt-2">正在載入各藥品資料庫與介面...</h5>
      </div>
    </div>
  </div>

  <!-- 引入 Bootstrap 的 JS 以支援頁籤切換 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/drug_workspace.js"></script>
</body>
</html>
