<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>填寫申請單</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-4">
    <div class="d-flex justify-content-between mb-3">
      <h3>📝 填寫申請單</h3>
      <a href="dashboard.html" class="btn btn-secondary">返回首頁</a>
    </div>

    <div class="card shadow-sm p-4">
      <form id="app-form">
        <div class="row g-3">
          
          <div class="col-md-4">
            <label class="form-label">病歷號</label>
            <input type="text" id="app-patient-id" class="form-control" required autofocus>
          </div>
          
          <div class="col-md-4">
            <label class="form-label">選擇藥品</label>
            <select id="app-drug-code" class="form-select" required disabled>
              <option value="" selected disabled>-- 請先輸入病歷號 --</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label">申請類別</label>
            <select id="app-type" class="form-select" required disabled>
              <option value="">-- 請選擇 --</option>
              <option value="初次申請" id="opt-initial">初次申請</option>
              <option value="展延申請" id="opt-extend">展延申請</option>
              <option value="複陽申請" id="opt-repositive">複陽申請</option>
            </select>
          </div>

          <!-- 提示訊息區塊 -->
          <div class="col-12" id="alert-msg-container" style="display:none;">
            <div id="alert-msg" class="alert alert-warning mb-0"></div>
          </div>

          <div class="col-md-4">
            <label class="form-label">申請天數</label>
            <!-- 展延時會變為 select，初次時為輸入框 -->
            <input type="number" id="app-days" class="form-control" required min="1">
            <select id="app-days-select" class="form-select" style="display:none;"></select>
          </div>
          
          <div class="col-md-4">
            <label class="form-label">申請數量 (支)</label>
            <input type="number" id="app-qty" class="form-control" required min="1">
          </div>

          <div class="col-md-4">
            <label class="form-label">處理單位</label>
            <input type="text" id="app-unit" class="form-control" required>
          </div>

          <div class="col-md-6" id="manager-input-group" style="display:none;">
            <label class="form-label text-danger fw-bold">主管核准人 (複陽必填)</label>
            <input type="text" id="app-manager" class="form-control border-danger">
          </div>

          <div class="col-md-6">
            <label class="form-label">備註</label>
            <input type="text" id="app-note" class="form-control">
          </div>

        </div>
        <button type="submit" id="btn-submit" class="btn btn-primary mt-4 w-100" disabled>送出申請</button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/application.js"></script>
</body>
</html>
