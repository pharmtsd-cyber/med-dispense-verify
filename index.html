<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>藥品調劑檢核系統 - 登入</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f7f6; }
    .login-container { max-width: 400px; margin-top: 10vh; }
  </style>
</head>
<body>

  <div class="container login-container">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="card-title text-center text-primary mb-4">藥品調劑檢核系統</h4>
        
        <div id="loading-msg" class="alert alert-info text-center">
          系統載入中，請稍候...
        </div>

        <form id="login-form" style="display: none;">
          <div class="mb-3">
            <label for="employee-select" class="form-label">請選擇登入人員：</label>
            <select id="employee-select" class="form-select" required>
              <option value="" selected disabled>-- 請選擇 --</option>
            </select>
          </div>
          
          <button type="submit" class="btn btn-primary w-100">進入系統</button>
        </form>
      </div>
    </div>
  </div>

  <!-- 引入 JS 檔案 -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
