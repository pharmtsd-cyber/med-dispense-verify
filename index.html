<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>藥品調劑檢核系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- 引入 Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; }
    /* 側邊欄樣式 */
    .sidebar { min-height: 100vh; width: 250px; background-color: #2c3e50; color: #fff; transition: all 0.3s; }
    .sidebar .nav-link { color: #adb5bd; padding: 12px 20px; border-radius: 0; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background-color: #34495e; border-left: 4px solid #3498db; }
    .sidebar-heading { padding: 15px 20px; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #4a5c6e; }
    .drug-menu-item { padding-left: 35px; font-size: 0.95rem; }
    /* 主內容區 */
    .main-content { flex-grow: 1; padding: 20px; height: 100vh; overflow-y: auto; }
    /* 隱藏登入前的畫面 */
    #app-container { display: none; }
  </style>
</head>
<body>

  <!-- ================= 登入畫面 ================= -->
  <div class="container mt-5" id="login-container" style="max-width: 400px;">
    <div class="card shadow">
      <div class="card-body p-4">
        <h4 class="text-center text-primary mb-4"><i class="bi bi-shield-lock"></i> 藥品調劑檢核系統</h4>
        <div id="loading-msg" class="alert alert-info text-center">系統載入中...</div>
        <form id="login-form" style="display: none;">
          <div class="mb-3">
            <label class="form-label">請選擇登入人員：</label>
            <select id="employee-select" class="form-select" required></select>
          </div>
          <button type="submit" class="btn btn-primary w-100">登入系統</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ================= 主系統介面 ================= -->
  <div class="d-flex" id="app-container">
    
    <!-- 左側選單 -->
    <div class="sidebar d-flex flex-column">
      <div class="sidebar-heading text-center"><i class="bi bi-hospital"></i> 藥局管理系統</div>
      
      <div class="p-3 text-center border-bottom border-secondary mb-2">
        <div class="small text-info">目前登入：</div>
        <div id="user-info" class="fw-bold"></div>
      </div>

      <ul class="nav flex-column mb-auto" id="sidebar-menu">
        <li class="nav-item">
          <a href="#" class="nav-link active" onclick="switchView('overview')">
            <i class="bi bi-house-door me-2"></i> 總覽首頁
          </a>
        </li>
        <!-- 動態插入藥品清單 -->
        <div id="dynamic-drug-menu"></div>
        
        <li class="nav-item mt-4 border-top border-secondary pt-2">
          <a href="#" class="nav-link" onclick="switchView('drug-manage')">
            <i class="bi bi-gear me-2"></i> 藥品主檔維護
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link text-danger" onclick="logout()">
            <i class="bi bi-box-arrow-right me-2"></i> 登出
          </a>
        </li>
      </ul>
    </div>

    <!-- 右側主內容區 -->
    <div class="main-content">
      
      <!-- 視圖 1: 總覽首頁 -->
      <div id="view-overview" class="view-section">
        <h3 class="mb-4">全院藥品總覽儀表板</h3>
        <div class="row g-3">
          <div class="col-md-4"><div class="card bg-primary text-white p-3"><h5 class="card-title">總調劑人次</h5><h2 id="total-patients">--</h2></div></div>
          <div class="col-md-4"><div class="card bg-success text-white p-3"><h5 class="card-title">今日申請量</h5><h2 id="today-apps">--</h2></div></div>
          <div class="col-md-4"><div class="card bg-warning text-dark p-3"><h5 class="card-title">異常退藥</h5><h2>0</h2></div></div>
        </div>
        <!-- 下方可以放綜合圖表 -->
      </div>

      <!-- 視圖 2: 單一藥品 Dashboard (動態生成內容) -->
      <div id="view-drug-dashboard" class="view-section" style="display:none;">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h3 id="current-drug-title" class="text-primary">-- 藥品儀表板 --</h3>
          <div>
            <button class="btn btn-outline-primary me-2" onclick="openApplicationForm()"><i class="bi bi-pencil-square"></i> 填寫申請單</button>
            <button class="btn btn-outline-success" onclick="openDispenseForm()"><i class="bi bi-upc-scan"></i> 調劑與檢核作業</button>
          </div>
        </div>
        
        <!-- 單一藥品統計 -->
        <div class="row mb-4">
          <div class="col-md-6">
            <div class="card shadow-sm"><div class="card-body"><h5>目前累計申請量</h5><h2 class="text-primary">150 支</h2></div></div>
          </div>
          <div class="col-md-6">
            <div class="card shadow-sm"><div class="card-body"><h5>目前已發放量</h5><h2 class="text-success">120 支</h2></div></div>
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-header bg-white fw-bold">最近使用紀錄 (開發中)</div>
          <div class="card-body">表格預留區...</div>
        </div>
      </div>

      <!-- 視圖 3: 填寫申請單 (整合進來) -->
      <div id="view-application" class="view-section" style="display:none;">
        <button class="btn btn-sm btn-secondary mb-3" onclick="switchView('drug-dashboard')"><i class="bi bi-arrow-left"></i> 返回藥品首頁</button>
        <h3 class="mb-4">📝 填寫申請單</h3>
        <div class="card shadow-sm p-4">
          <!-- 這裡會放入之前寫好的申請單 HTML -->
          <h5>申請單功能建置中...</h5>
        </div>
      </div>

      <!-- 視圖 4: 調劑作業 (整合進來) -->
      <div id="view-dispense" class="view-section" style="display:none;">
        <button class="btn btn-sm btn-secondary mb-3" onclick="switchView('drug-dashboard')"><i class="bi bi-arrow-left"></i> 返回藥品首頁</button>
        <h3 class="mb-4">💊 調劑與檢核作業</h3>
        <!-- 這裡會放入之前寫好的調劑表單 HTML -->
        <h5>調劑功能建置中...</h5>
      </div>

      <!-- 視圖 5: 藥品主檔維護 (整合進來) -->
      <div id="view-drug-manage" class="view-section" style="display:none;">
        <h3 class="mb-4">⚙️ 藥品主檔維護</h3>
        <div class="card shadow-sm p-4">
           <!-- 這裡會放入藥品維護 HTML -->
           <h5>主檔維護建置中...</h5>
        </div>
      </div>

    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
