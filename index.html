<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>藥品調劑檢核系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- 引入 Chart.js 繪製折線圖 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; }
    
    /* === 側邊欄標準化 CSS === */
    .sidebar { min-height: 100vh; width: 260px; background-color: #212529; color: #fff; transition: all 0.3s; }
    .sidebar-heading { padding: 15px 20px; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #495057; color: #f8f9fa; }
    .sidebar .nav-link { color: #adb5bd; padding: 12px 20px; font-weight: 500; border-radius: 0; border-left: 4px solid transparent; }
    .sidebar .nav-link:hover { color: #fff; background-color: #343a40; border-left-color: #6c757d; }
    .sidebar .nav-link.active { color: #fff; background-color: #0d6efd; border-left-color: #86b7fe; }
    .drug-menu-item { padding-left: 40px; font-size: 0.95rem; }
    
    /* === 主內容區 === */
    .main-content { flex-grow: 1; height: 100vh; overflow-y: auto; background-color: #f8f9fa; }
    
    /* 修正 Bootstrap d-flex 導致的隱藏失效問題 */
    .d-none-important { display: none !important; }
  </style>
</head>
<body>

  <!-- ================= 登入畫面 ================= -->
  <div class="container mt-5" id="login-container" style="max-width: 400px;">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h4 class="text-center text-primary mb-4"><i class="bi bi-shield-lock"></i> 藥品調劑檢核系統</h4>
        <div id="loading-msg" class="alert alert-info text-center">系統載入中...</div>
        
        <form id="login-form" class="d-none-important">
          <div class="mb-3">
            <label class="form-label fw-bold">請輸入員工編號：</label>
            <input type="text" id="employee-input" class="form-control form-control-lg" required placeholder="例如: 1038391" autofocus>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100">登入系統</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ================= 主系統介面 ================= -->
  <div id="app-container" class="d-none-important d-flex">
    
    <!-- 左側選單 -->
    <div class="sidebar d-flex flex-column shadow">
      <div class="sidebar-heading text-center"><i class="bi bi-hospital"></i> 藥局管理系統</div>
      <div class="p-3 text-center border-bottom border-secondary mb-2 bg-dark">
        <div class="small text-secondary mb-1">目前登入</div>
        <div id="user-info" class="fw-bold text-light"></div>
      </div>

      <ul class="nav flex-column mb-auto" id="sidebar-menu">
        <li class="nav-item">
          <a href="#" class="nav-link active" onclick="switchView('overview', this)">
            <i class="bi bi-house-door me-2"></i> 總覽首頁
          </a>
        </li>
        
        <!-- 動態插入藥品清單 -->
        <div id="dynamic-drug-menu"></div>
        
        <li class="nav-item mt-4 border-top border-secondary pt-2">
          <a href="#" class="nav-link" onclick="switchView('drug-manage', this)">
            <i class="bi bi-gear me-2"></i> 藥品主檔維護
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link text-danger" onclick="logout()">
            <i class="bi bi-box-arrow-right me-2"></i> 登出
          </a>
        </li>
      </ul>
    </div>

<!-- 右側主內容區 -->
    <div class="main-content p-4">
      
      <!-- 視圖 1: 總覽首頁 -->
      <div id="view-overview" class="view-section">
        <div class="d-flex justify-content-between align-items-end mb-4 border-bottom pb-2">
          <h3 class="text-dark fw-bold mb-0">全院藥品總覽儀表板</h3>
          <div class="d-flex gap-2">
            <input type="text" id="overview-pid-filter" class="form-control form-control-sm" placeholder="輸入病歷號" style="width: 120px;">
            <select id="overview-drug-filter" class="form-select form-select-sm" style="width: auto;">
              <option value="ALL">全部藥品</option>
            </select>
            <input type="date" id="overview-date-start" class="form-control form-control-sm" style="width: auto;">
            <span class="align-self-center text-muted">至</span>
            <input type="date" id="overview-date-end" class="form-control form-control-sm" style="width: auto;">
            <button class="btn btn-sm btn-secondary" onclick="renderOverview()">查詢</button>
          </div>
        </div>
        <div id="overview-content"></div>
      </div>

      <!-- 視圖 2: 單一藥品主頁面 -->
      <div id="view-drug-dashboard" class="view-section d-none-important">
        <div class="d-flex justify-content-between align-items-start mb-3 border-bottom pb-3">
          <div>
            <h3 id="current-drug-title" class="text-primary fw-bold mb-3">-- 藥品儀表板 --</h3>
            <div class="d-flex gap-3">
              <button class="btn btn-primary btn-lg shadow-sm" onclick="openApplicationForm()">
                <i class="bi bi-pencil-square"></i> 填寫申請單
              </button>
              <button class="btn btn-success btn-lg shadow-sm" onclick="openDispenseForm()">
                <i class="bi bi-upc-scan"></i> 調劑剩餘量檢核
              </button>
            </div>
          </div>
          
          <div class="card shadow-sm border-0 bg-light">
            <div class="card-body p-2 d-flex gap-2">
              <span class="align-self-center text-muted small fw-bold"><i class="bi bi-search"></i> 區間與病歷查詢</span>
              <input type="text" id="single-drug-pid-filter" class="form-control form-control-sm" placeholder="病歷號" style="width: 100px;">
              <input type="date" id="single-drug-date-start" class="form-control form-control-sm" style="width: auto;">
              <span class="align-self-center text-muted">-</span>
              <input type="date" id="single-drug-date-end" class="form-control form-control-sm" style="width: auto;">
              <button class="btn btn-sm btn-secondary" onclick="refreshSingleDrugDashboard()">查詢</button>
            </div>
          </div>
        </div>
        
        <div id="drug-dashboard-stats" class="mb-4"></div>

        <div class="card shadow-sm border-0">
          <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold">近期作業紀錄</h5>
            <div class="d-flex gap-2">
              <select id="single-drug-record-type" class="form-select form-select-sm" style="width: auto;" onchange="refreshSingleDrugDashboard()">
                <option value="ALL">全部紀錄</option>
                <option value="APP">僅顯示申請單</option>
                <option value="DIS">僅顯示調劑/退藥</option>
              </select>
            </div>
          </div>
          <div class="card-body">
            <div class="table-responsive" id="single-drug-records-table">
               <div class="text-center text-muted py-4">請點擊右上方查詢按鈕載入紀錄...</div>
            </div>
          </div>
        </div>
      </div>

<!-- 視圖 3: 填寫申請單 -->
      <div id="view-application" class="view-section d-none-important">
        <button class="btn btn-sm btn-secondary mb-3" onclick="switchView('drug-dashboard')"><i class="bi bi-arrow-left"></i> 返回 <span id="app-back-drug-name"></span></button>
        <h3 class="mb-4 text-primary fw-bold">📝 填寫申請單 (<span id="app-form-drug-name" class="text-danger"></span>)</h3>
        
        <div class="card shadow-sm p-4">
          <form id="app-form">
            <!-- 新增：藥師與單位設定區 -->
            <div class="row g-3 mb-3 pb-3 border-bottom border-light">
              <div class="col-md-3">
                <label class="form-label text-muted small fw-bold">填寫藥師編號</label>
                <div class="input-group">
                  <input type="text" id="app-pharmacist-id" class="form-control bg-light" readonly required>
                  <button class="btn btn-outline-secondary" type="button" onclick="enablePharmacistChange('app')">重選</button>
                </div>
              </div>
              <div class="col-md-3">
                <label class="form-label text-muted small fw-bold">藥師姓名</label>
                <input type="text" id="app-pharmacist-name" class="form-control bg-light border-0" readonly required>
              </div>
              <div class="col-md-4">
                <label class="form-label text-muted small fw-bold">處理單位</label>
                <select id="app-unit" class="form-select border-primary" required></select>
              </div>
            </div>

            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label fw-bold">病歷號</label>
                <input type="text" id="app-patient-id" class="form-control" required autofocus placeholder="輸入後離開欄位自動檢核">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">申請類別</label>
                <select id="app-type" class="form-select border-primary" required disabled>
                  <option value="">-- 請先輸入病歷號 --</option>
                  <option value="初次申請" id="opt-initial">初次申請</option>
                  <option value="展延申請" id="opt-extend">展延申請</option>
                  <option value="複陽申請" id="opt-repositive">複陽申請</option>
                </select>
              </div>
              <div class="col-12" id="alert-msg-container" style="display:none;">
                <div id="alert-msg" class="alert alert-warning mb-0"></div>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">申請天數 <span class="text-danger small">(系統鎖定最大值)</span></label>
                <input type="number" id="app-days" class="form-control bg-light" required readonly>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-bold">申請數量 <span class="text-danger small">(系統鎖定最大值)</span></label>
                <input type="number" id="app-qty" class="form-control bg-light" required readonly>
              </div>
              <div class="col-md-4" id="manager-input-group" style="display:none;">
                <label class="form-label text-danger fw-bold">主管核准人 (複陽必填)</label>
                <input type="text" id="app-manager" class="form-control border-danger">
              </div>
              <div class="col-md-8">
                <label class="form-label fw-bold">備註</label>
                <input type="text" id="app-note" class="form-control">
              </div>
            </div>
            <button type="submit" id="btn-submit-app" class="btn btn-primary mt-4 w-100 fw-bold shadow-sm" disabled>確認送出申請</button>
          </form>
        </div>
      </div>

      <!-- 視圖 4: 調劑作業 -->
      <div id="view-dispense" class="view-section d-none-important">
        <button class="btn btn-sm btn-secondary mb-3" onclick="switchView('drug-dashboard')"><i class="bi bi-arrow-left"></i> 返回 <span id="disp-back-drug-name"></span></button>
        <h3 class="mb-4 text-success fw-bold">💊 調劑剩餘量檢核 (<span id="disp-form-drug-name" class="text-danger"></span>)</h3>
        
        <div class="card shadow-sm mb-3">
          <div class="card-body bg-light pb-2">
            <!-- 新增：藥師與單位設定區 -->
            <div class="row g-2">
              <div class="col-md-3">
                <label class="form-label text-muted small fw-bold mb-1">作業藥師</label>
                <div class="input-group input-group-sm">
                  <input type="text" id="disp-pharmacist-id" class="form-control bg-white" readonly required>
                  <button class="btn btn-outline-secondary" type="button" onclick="enablePharmacistChange('disp')">重選</button>
                </div>
              </div>
              <div class="col-md-2">
                <label class="form-label text-muted small fw-bold mb-1">姓名</label>
                <input type="text" id="disp-pharmacist-name" class="form-control form-control-sm border-0" readonly required>
              </div>
              <div class="col-md-3">
                <label class="form-label text-muted small fw-bold mb-1">處理單位</label>
                <select id="disp-unit" class="form-select form-select-sm border-primary" required></select>
              </div>
              <div class="col-md-3">
                <label class="form-label text-danger small fw-bold mb-1">作業類別</label>
                <select id="disp-type" class="form-select form-select-sm border-danger fw-bold">
                  <option value="調劑">調劑發藥</option>
                  <option value="退藥">退藥作業</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="card shadow-sm mb-4 border-danger">
          <div class="card-body bg-danger bg-opacity-10">
            <h5 class="text-danger"><i class="bi bi-camera"></i> 掃描模式就緒 (刷入後即時檢核)</h5>
            <input type="text" id="barcode-input" class="form-control mt-2 border-danger form-control-lg" placeholder="確認上方設定無誤後，請刷入藥袋條碼..." autofocus>
          </div>
        </div>

        <form id="dispense-form" class="card shadow-sm p-4 border-0 d-none-important">
          <h5 class="fw-bold border-bottom pb-2 mb-3">📋 檢核結果與紀錄</h5>
          <div class="row g-3 mb-3">
            <div class="col-md-3">
              <label class="text-muted small">病歷號</label>
              <input type="text" id="disp-patient-id" class="form-control fw-bold border-0 bg-white text-primary" readonly required>
            </div>
            <div class="col-md-3">
              <label class="text-muted small">領藥號</label>
              <input type="text" id="disp-no" class="form-control fw-bold border-0 bg-white" readonly required>
            </div>
            <div class="col-md-3">
              <label class="text-muted small">解析數量</label>
              <input type="number" id="disp-qty" class="form-control fw-bold border-0 bg-white text-danger" readonly required>
            </div>
            <div class="col-md-12">
              <label class="form-label fw-bold">備註 (退藥請填理由)</label>
              <input type="text" id="disp-note" class="form-control border-primary" placeholder="可選填...">
            </div>
          </div>
          
          <!-- 即時檢核紀錄顯示區 -->
          <div id="disp-check-result" class="alert alert-info mt-2 mb-3">資料計算中...</div>
          <div class="table-responsive mb-3">
            <table class="table table-sm table-bordered text-center align-middle">
              <thead class="table-light text-muted">
                <tr><th>申請日期/類別</th><th>申請量</th><th>已發藥量</th><th>已退藥量</th></tr>
              </thead>
              <tbody id="disp-history-table"></tbody>
            </table>
          </div>

          <button type="submit" id="btn-submit-disp" class="btn btn-success mt-2 w-100 fw-bold fs-5 shadow-sm">確認寫入紀錄</button>
        </form>
      </div>

      <!-- 視圖 5: 藥品主檔維護 (已完整整合) -->
      <div id="view-drug-manage" class="view-section d-none-important">
        <h3 class="mb-4 text-secondary fw-bold">⚙️ 藥品主檔維護</h3>
        <div class="row">
          <div class="col-md-4 mb-4">
            <div class="card shadow-sm p-3 border-0">
              <h5 class="fw-bold">新增 / 編輯藥品</h5>
              <hr>
              <form id="drug-form">
                <div class="mb-2">
                  <label class="form-label small fw-bold">藥品代碼 (唯一值)</label>
                  <input type="text" id="drug-code" class="form-control" required placeholder="如: ire*d1">
                </div>
                <div class="mb-2">
                  <label class="form-label small fw-bold">藥品名稱</label>
                  <input type="text" id="drug-name" class="form-control" required>
                </div>
                <div class="mb-2">
                  <label class="form-label small fw-bold">管制天數 (防呆區間)</label>
                  <input type="number" id="drug-control-days" class="form-control" value="14" required>
                </div>
                <div class="row mb-2">
                  <div class="col-6">
                    <label class="form-label small fw-bold">預設申請天數</label>
                    <input type="number" id="drug-default-days" class="form-control" value="3" required>
                  </div>
                  <div class="col-6">
                    <label class="form-label small fw-bold">預設申請量</label>
                    <input type="number" id="drug-default-qty" class="form-control" value="3" required>
                  </div>
                </div>
                <div class="row mb-3">
                  <div class="col-6">
                    <label class="form-label small fw-bold">展延天數上限</label>
                    <input type="number" id="drug-max-ext-days" class="form-control" value="5" required>
                  </div>
                  <div class="col-6">
                    <label class="form-label small fw-bold">展延數量上限</label>
                    <input type="number" id="drug-max-ext-qty" class="form-control" value="2" required>
                  </div>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-bold">啟用狀態</label>
                  <select id="drug-status" class="form-select">
                    <option value="Y">Y - 啟用</option>
                    <option value="N">N - 停用</option>
                  </select>
                </div>
                <button type="submit" id="btn-save-drug" class="btn btn-primary w-100 fw-bold">儲存藥品設定</button>
                <button type="button" id="btn-clear-drug" class="btn btn-outline-secondary w-100 mt-2">清除表單</button>
              </form>
            </div>
          </div>
          <div class="col-md-8">
            <div class="card shadow-sm p-3 border-0">
              <h5 class="fw-bold">現有藥品清單</h5>
              <hr>
              <div class="table-responsive">
                <table class="table table-hover align-middle">
                  <thead class="table-light text-muted small">
                    <tr>
                      <th>代碼</th>
                      <th>名稱</th>
                      <th>管制</th>
                      <th>初次(天/量)</th>
                      <th>展延上限(天/量)</th>
                      <th>狀態</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody id="drug-table-body">
                    <tr><td colspan="7" class="text-center">載入中...</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
