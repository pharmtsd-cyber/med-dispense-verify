<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>藥品調劑檢核系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; }
    .sidebar { min-height: 100vh; width: 260px; background-color: #212529; color: #fff; transition: all 0.3s; }
    .sidebar-heading { padding: 15px 20px; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #495057; color: #f8f9fa; }
    .sidebar .nav-link { color: #adb5bd; padding: 12px 20px; font-weight: 500; border-radius: 0; border-left: 4px solid transparent; }
    .sidebar .nav-link:hover { color: #fff; background-color: #343a40; border-left-color: #6c757d; }
    .sidebar .nav-link.active { color: #fff; background-color: #0d6efd; border-left-color: #86b7fe; }
    .drug-menu-item { padding-left: 40px; font-size: 0.95rem; }
    .main-content { flex-grow: 1; height: 100vh; overflow-y: auto; background-color: #f8f9fa; }
    .d-none-important { display: none !important; }
    /* 優化 Radio Button 群組樣式 */
    .btn-group.flex-wrap { display: flex; flex-wrap: wrap; }
    .btn-group.flex-wrap > .btn { flex: 1 1 auto; margin-bottom: 5px; border-radius: 0.375rem !important; margin-right: 5px; }
  </style>
</head>
<body>

  <!-- ================= 登入畫面 ================= -->
  <div class="container mt-5" id="login-container" style="max-width: 400px;">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h4 class="text-center text-primary mb-4"><i class="bi bi-shield-lock"></i> 藥品調劑檢核系統</h4>
        <div id="loading-msg" class="alert alert-info text-center">系統資源載入中，請稍候...</div>
        
        <form id="login-form" class="d-none-important">
          <div class="mb-3">
            <label class="form-label fw-bold">請輸入員工編號：</label>
            <input type="text" id="employee-input" class="form-control form-control-lg text-uppercase" required placeholder="例如: 1038391" autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label fw-bold">請選擇登入單位：</label>
            <select id="login-unit-select" class="form-select form-select-lg" required>
              <option value="" selected disabled>-- 請選擇 --</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100">登入系統</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ================= 主系統介面 ================= -->
  <div id="app-container" class="d-none-important d-flex">
    
    <!-- 左側選單 -->
    <div class="sidebar d-flex flex-column shadow">
      <div class="sidebar-heading text-center"><i class="bi bi-hospital"></i> 藥局管理系統</div>
      <div class="p-3 text-center border-bottom border-secondary mb-2 bg-dark">
        <div class="small text-secondary mb-1">目前登入</div>
        <div id="user-info" class="fw-bold text-light"></div>
      </div>

      <ul class="nav flex-column mb-auto" id="sidebar-menu">
        <li class="nav-item"><a href="#" class="nav-link active" onclick="switchView('overview', this)"><i class="bi bi-house-door me-2"></i> 總覽首頁</a></li>
        <div id="dynamic-drug-menu"></div>
        <li class="nav-item mt-4 border-top border-secondary pt-2"><a href="#" class="nav-link" onclick="switchView('drug-manage', this)"><i class="bi bi-gear me-2"></i> 藥品主檔維護</a></li>
        <li class="nav-item mt-2"><a href="#" class="nav-link text-warning" onclick="forceSyncData()"><i class="bi bi-arrow-repeat me-2"></i> 強制同步最新資料</a></li>
        <li class="nav-item"><a href="#" class="nav-link text-danger" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i> 登出</a></li>
      </ul>
    </div>

    <!-- 右側主內容區 -->
    <div class="main-content p-4">
      
      <!-- 視圖 1: 總覽首頁 -->
      <div id="view-overview" class="view-section">
        <div class="d-flex justify-content-between align-items-end mb-4 border-bottom pb-2">
          <h3 class="text-dark fw-bold mb-0">全院藥品總覽儀表板</h3>
          <div class="d-flex gap-2">
            <input type="text" id="overview-pid-filter" class="form-control form-control-sm text-uppercase" placeholder="輸入病歷號" style="width: 120px;">
            <select id="overview-drug-filter" class="form-select form-select-sm" style="width: auto;">
              <option value="ALL">全部藥品</option>
            </select>
            <input type="date" id="overview-date-start" class="form-control form-control-sm" style="width: auto;">
            <span class="align-self-center text-muted">至</span>
            <input type="date" id="overview-date-end" class="form-control form-control-sm" style="width: auto;">
            <button class="btn btn-sm btn-secondary" onclick="renderOverview()">查詢</button>
          </div>
        </div>
        <div id="overview-content"></div>
      </div>

      <!-- 視圖 2: 單一藥品主頁面 -->
      <div id="view-drug-dashboard" class="view-section d-none-important">
        <div class="d-flex justify-content-between align-items-start mb-3 border-bottom pb-3">
          <div>
            <h3 id="current-drug-title" class="text-primary fw-bold mb-3">-- 藥品儀表板 --</h3>
            <div class="d-flex gap-3">
              <button class="btn btn-primary btn-lg shadow-sm" onclick="openApplicationForm()"><i class="bi bi-pencil-square"></i> 填寫申請單</button>
              <button class="btn btn-success btn-lg shadow-sm" onclick="openDispenseForm()"><i class="bi bi-upc-scan"></i> 調劑剩餘量檢核</button>
            </div>
          </div>
          <div class="card shadow-sm border-0 bg-light">
            <div class="card-body p-2 d-flex gap-2">
              <span class="align-self-center text-muted small fw-bold"><i class="bi bi-search"></i> 區間與病歷查詢</span>
              <input type="text" id="single-drug-pid-filter" class="form-control form-control-sm text-uppercase" placeholder="病歷號" style="width: 100px;">
              <input type="date" id="single-drug-date-start" class="form-control form-control-sm" style="width: auto;">
              <span class="align-self-center text-muted">-</span>
              <input type="date" id="single-drug-date-end" class="form-control form-control-sm" style="width: auto;">
              <button class="btn btn-sm btn-secondary" onclick="refreshSingleDrugDashboard()">查詢</button>
            </div>
          </div>
        </div>
        
        <div id="drug-dashboard-stats" class="mb-4"></div>
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold">近期作業紀錄</h5>
            <div class="d-flex gap-2">
              <select id="single-drug-record-type" class="form-select form-select-sm" style="width: auto;" onchange="refreshSingleDrugDashboard()">
                <option value="ALL">全部紀錄</option>
                <option value="APP">僅顯示申請單</option>
                <option value="DIS">僅顯示調劑/退藥</option>
              </select>
            </div>
          </div>
          <div class="card-body">
            <div class="table-responsive" id="single-drug-records-table"></div>
          </div>
        </div>
      </div>

      <!-- 視圖 3: 填寫申請單 -->
      <div id="view-application" class="view-section d-none-important">
        <button class="btn btn-sm btn-secondary mb-3" onclick="switchView('drug-dashboard')"><i class="bi bi-arrow-left"></i> 返回 <span id="app-back-drug-name"></span></button>
        <h3 class="mb-3 text-primary fw-bold">📝 填寫申請單 (<span id="app-form-drug-name" class="text-danger"></span>)</h3>
        
        <!-- 👉 新增：動態藥品資訊小卡 -->
        <div class="card bg-primary bg-opacity-10 border-primary mb-3">
          <div class="card-body p-2" id="app-drug-info-card"></div>
        </div>
        
        <div class="card shadow-sm p-4 mb-4">
          <form id="app-form">
            <div class="row g-3 mb-3 pb-3 border-bottom border-light">
              <div class="col-md-3">
                <label class="form-label text-muted small fw-bold">填寫藥師編號</label>
                <div class="input-group">
                  <input type="text" id="app-pharmacist-id" class="form-control bg-light text-uppercase" readonly required>
                  <button class="btn btn-outline-secondary" type="button" onclick="enablePharmacistChange('app')">重選</button>
                </div>
              </div>
              <div class="col-md-3">
                <label class="form-label text-muted small fw-bold">藥師姓名</label>
                <input type="text" id="app-pharmacist-name" class="form-control bg-light border-0" readonly required>
              </div>
              <!-- 👉 更新：單位改用 Button Group 單選 -->
              <div class="col-md-6">
                <label class="form-label text-muted small fw-bold d-block">處理單位</label>
                <div id="app-unit-group" class="btn-group flex-wrap" role="group"></div>
              </div>
            </div>

            <div class="row g-3">
              <div class="col-md-3">
                <label class="form-label fw-bold">病歷號</label>
                <input type="text" id="app-patient-id" class="form-control text-uppercase" required autofocus placeholder="輸入後自動檢核">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-bold mb-1 d-block">申請類別</label>
                <div class="btn-group w-100 shadow-sm" role="group" id="app-type-group">
                  <input type="radio" class="btn-check" name="app-type" id="opt-initial" value="初次申請" autocomplete="off" disabled>
                  <label class="btn btn-outline-primary" for="opt-initial">初次申請</label>
                  <input type="radio" class="btn-check" name="app-type" id="opt-extend" value="展延申請" autocomplete="off" disabled>
                  <label class="btn btn-outline-primary" for="opt-extend">展延申請</label>
                  <input type="radio" class="btn-check" name="app-type" id="opt-repositive" value="複陽申請" autocomplete="off" disabled>
                  <label class="btn btn-outline-primary" for="opt-repositive">複陽申請</label>
                </div>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-bold">啟用日期</label>
                <input type="date" id="app-start-date" class="form-control border-primary" required>
              </div>
              
              <div class="col-12" id="alert-msg-container" style="display:none;"><div id="alert-msg" class="alert alert-warning mb-0"></div></div>
              
              <!-- 取消 (鎖定上限) 文字提示，由上方資訊卡呈現 -->
              <div class="col-md-3">
                <label class="form-label fw-bold">申請天數</label>
                <input type="number" id="app-days" class="form-control" required min="1">
              </div>
              <div class="col-md-3">
                <label class="form-label fw-bold">申請數量</label>
                <input type="number" id="app-qty" class="form-control" required min="1">
              </div>
              <div class="col-md-6" id="manager-input-group" style="display:none;">
                <label class="form-label text-danger fw-bold">主管核准人 (複陽必填)</label>
                <input type="text" id="app-manager" class="form-control border-danger">
              </div>
              <div class="col-md-12">
                <label class="form-label fw-bold">備註</label>
                <input type="text" id="app-note" class="form-control">
              </div>
            </div>
            <button type="submit" id="btn-submit-app" class="btn btn-primary mt-4 w-100 fw-bold shadow-sm" disabled>確認送出申請</button>
          </form>
        </div>

        <div class="card shadow-sm border-0">
          <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold"><i class="bi bi-clock-history"></i> 本藥品歷史申請紀錄</h5>
            <div class="d-flex gap-2">
              <input type="text" id="app-hist-pid" class="form-control form-control-sm text-uppercase" placeholder="病歷號篩選" style="width: 120px;">
              <input type="date" id="app-hist-start" class="form-control form-control-sm">
              <span class="align-self-center">-</span>
              <input type="date" id="app-hist-end" class="form-control form-control-sm">
              <button class="btn btn-sm btn-secondary" onclick="renderAppHistory()">查詢</button>
            </div>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0 text-center">
                <thead class="table-light small">
                  <tr><th>申請日期</th><th>啟用日期</th><th>病歷號</th><th>類別</th><th>天數/數量</th><th>處理單位</th></tr>
                </thead>
                <tbody id="app-history-table"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- 視圖 4: 調劑作業 -->
      <div id="view-dispense" class="view-section d-none-important">
        <button class="btn btn-sm btn-secondary mb-3" onclick="switchView('drug-dashboard')"><i class="bi bi-arrow-left"></i> 返回 <span id="disp-back-drug-name"></span></button>
        <h3 class="mb-4 text-success fw-bold">💊 調劑剩餘量檢核 (<span id="disp-form-drug-name" class="text-danger"></span>)</h3>
        
        <div class="card shadow-sm mb-3 border-0">
          <div class="card-body bg-light pb-2">
            <div class="row g-2">
              <div class="col-md-3">
                <label class="form-label text-muted small fw-bold mb-1">作業藥師</label>
                <div class="input-group input-group-sm">
                  <input type="text" id="disp-pharmacist-id" class="form-control bg-white text-uppercase" readonly required>
                  <button class="btn btn-outline-secondary" type="button" onclick="enablePharmacistChange('disp')">重選</button>
                </div>
              </div>
              <div class="col-md-3">
                <label class="form-label text-muted small fw-bold mb-1">姓名</label>
                <input type="text" id="disp-pharmacist-name" class="form-control form-control-sm border-0 bg-transparent" readonly required>
              </div>
              <!-- 👉 更新：單位改用 Button Group 單選 -->
              <div class="col-md-6">
                <label class="form-label text-muted small fw-bold mb-1 d-block">處理單位</label>
                <div id="disp-unit-group" class="btn-group flex-wrap" role="group"></div>
              </div>
              
              <div class="col-md-12 mt-2">
                <label class="form-label text-dark small fw-bold mb-1 d-block">作業類別 / 手動作業</label>
                <div class="d-flex gap-2 align-items-center">
                  <div class="btn-group shadow-sm" role="group" style="width: 250px;">
                    <input type="radio" class="btn-check" name="disp-type" id="disp-type-disp" value="調劑" autocomplete="off" checked>
                    <label class="btn btn-outline-success fw-bold" for="disp-type-disp">調劑發藥</label>
                    <input type="radio" class="btn-check" name="disp-type" id="disp-type-ret" value="退藥" autocomplete="off">
                    <label class="btn btn-outline-danger fw-bold" for="disp-type-ret">退藥作業</label>
                  </div>
                  <button class="btn btn-secondary shadow-sm" type="button" onclick="manualDispenseModal()"><i class="bi bi-keyboard"></i> 無條碼手動輸入</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="card shadow-sm mb-4 border-success" id="disp-scan-card">
          <div class="card-body bg-success bg-opacity-10" id="disp-scan-body">
            <h5 class="text-success fw-bold" id="disp-scan-title"><i class="bi bi-upc-scan"></i> 條碼掃描區 (調劑模式 - 即時寫入)</h5>
            <input type="text" id="barcode-input" class="form-control mt-2 border-success form-control-lg text-uppercase fw-bold text-center" placeholder="確認上方設定無誤後，請刷入藥袋條碼..." autofocus>
          </div>
        </div>
        
        <div id="disp-check-result" class="alert alert-info mt-2 mb-3 d-none-important"></div>

        <div class="card shadow-sm border-0 mt-4">
          <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold"><i class="bi bi-list-check"></i> 近期作業檢核清單</h5>
            <div class="d-flex gap-2">
              <input type="text" id="disp-hist-pid" class="form-control form-control-sm text-uppercase" placeholder="病歷號" style="width: 120px;">
              <input type="date" id="disp-hist-start" class="form-control form-control-sm">
              <span class="align-self-center">-</span>
              <input type="date" id="disp-hist-end" class="form-control form-control-sm">
              <button class="btn btn-sm btn-secondary" onclick="renderDispenseHistory()">查詢</button>
            </div>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0 text-center">
                <thead class="table-light small">
                  <tr><th>作業時間</th><th>病歷號</th><th>類別</th><th>數量</th><th>依據單號</th></tr>
                </thead>
                <tbody id="disp-history-table"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

      <!-- 👉 補回視圖 5: 藥品主檔維護 -->
      <div id="view-drug-manage" class="view-section d-none-important">
        <h3 class="mb-4 text-secondary fw-bold">⚙️ 藥品主檔維護</h3>
        <div class="row">
          <div class="col-md-4 mb-4">
            <div class="card shadow-sm p-3 border-0">
              <h5 class="fw-bold">新增 / 編輯藥品</h5>
              <hr>
              <form id="drug-form">
                <div class="mb-2"><label class="form-label small fw-bold">藥品代碼 (唯一值)</label><input type="text" id="drug-code" class="form-control text-uppercase" required></div>
                <div class="mb-2"><label class="form-label small fw-bold">藥品名稱</label><input type="text" id="drug-name" class="form-control" required></div>
                <div class="mb-2"><label class="form-label small fw-bold">管制天數</label><input type="number" id="drug-control-days" class="form-control" value="14" required></div>
                <div class="row mb-2">
                  <div class="col-6"><label class="form-label small fw-bold">預設申請天數</label><input type="number" id="drug-default-days" class="form-control" value="3" required></div>
                  <div class="col-6"><label class="form-label small fw-bold">預設申請量</label><input type="number" id="drug-default-qty" class="form-control" value="3" required></div>
                </div>
                <div class="row mb-3">
                  <div class="col-6"><label class="form-label small fw-bold">展延天數上限</label><input type="number" id="drug-max-ext-days" class="form-control" value="5" required></div>
                  <div class="col-6"><label class="form-label small fw-bold">展延數量上限</label><input type="number" id="drug-max-ext-qty" class="form-control" value="2" required></div>
                </div>
                <div class="mb-3">
                  <label class="form-label small fw-bold">啟用狀態</label>
                  <select id="drug-status" class="form-select">
                    <option value="Y">Y - 啟用</option>
                    <option value="N">N - 停用</option>
                  </select>
                </div>
                <button type="submit" id="btn-save-drug" class="btn btn-primary w-100 fw-bold">儲存藥品設定</button>
                <button type="button" id="btn-clear-drug" class="btn btn-outline-secondary w-100 mt-2">清除表單</button>
              </form>
            </div>
          </div>
          <div class="col-md-8">
            <div class="card shadow-sm p-3 border-0">
              <h5 class="fw-bold">現有藥品清單</h5>
              <hr>
              <div class="table-responsive">
                <table class="table table-hover align-middle text-center">
                  <thead class="table-light text-muted small">
                    <tr><th>代碼</th><th>名稱</th><th>管制</th><th>初次(天/量)</th><th>展延上限</th><th>狀態</th><th>操作</th></tr>
                  </thead>
                  <tbody id="drug-table-body"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 彈窗：檢視申請單細節 -->
  <div class="modal fade" id="appDetailModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">📄 申請單細節</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="appDetailContent">載入中...</div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/main.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/application.js"></script>
  <script src="js/dispense.js"></script>
  <script src="js/drug_manage.js"></script>
</body>
</html>
