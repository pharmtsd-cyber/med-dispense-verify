<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>藥品調劑檢核系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- 引入 Chart.js 繪製折線圖 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; }
    
    /* === 側邊欄標準化 CSS === */
    .sidebar { min-height: 100vh; width: 260px; background-color: #212529; color: #fff; transition: all 0.3s; }
    .sidebar-heading { padding: 15px 20px; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid #495057; color: #f8f9fa; }
    .sidebar .nav-link { color: #adb5bd; padding: 12px 20px; font-weight: 500; border-radius: 0; border-left: 4px solid transparent; }
    .sidebar .nav-link:hover { color: #fff; background-color: #343a40; border-left-color: #6c757d; }
    .sidebar .nav-link.active { color: #fff; background-color: #0d6efd; border-left-color: #86b7fe; }
    .drug-menu-item { padding-left: 40px; font-size: 0.95rem; }
    
    /* === 主內容區 === */
    .main-content { flex-grow: 1; height: 100vh; overflow-y: auto; background-color: #f8f9fa; }
    
    /* 修正 Bootstrap d-flex 導致的隱藏失效問題 */
    .d-none-important { display: none !important; }
  </style>
</head>
<body>

  <!-- ================= 登入畫面 ================= -->
  <div class="container mt-5" id="login-container" style="max-width: 400px;">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h4 class="text-center text-primary mb-4"><i class="bi bi-shield-lock"></i> 藥品調劑檢核系統</h4>
        <div id="loading-msg" class="alert alert-info text-center">系統載入中...</div>
        
        <form id="login-form" class="d-none-important">
          <div class="mb-3">
            <label class="form-label fw-bold">請輸入員工編號：</label>
            <input type="text" id="employee-input" class="form-control form-control-lg" required placeholder="例如: 1038391" autofocus>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100">登入系統</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ================= 主系統介面 ================= -->
  <div id="app-container" class="d-none-important d-flex">
    
    <!-- 左側選單 -->
    <div class="sidebar d-flex flex-column shadow">
      <div class="sidebar-heading text-center"><i class="bi bi-hospital"></i> 藥局管理系統</div>
      <div class="p-3 text-center border-bottom border-secondary mb-2 bg-dark">
        <div class="small text-secondary mb-1">目前登入</div>
        <div id="user-info" class="fw-bold text-light"></div>
      </div>

      <ul class="nav flex-column mb-auto" id="sidebar-menu">
        <li class="nav-item">
          <a href="#" class="nav-link active" onclick="switchView('overview', this)">
            <i class="bi bi-house-door me-2"></i> 總覽首頁
          </a>
        </li>
        
        <!-- 動態插入藥品清單 -->
        <div id="dynamic-drug-menu"></div>
        
        <li class="nav-item mt-4 border-top border-secondary pt-2">
          <a href="#" class="nav-link" onclick="switchView('drug-manage', this)">
            <i class="bi bi-gear me-2"></i> 藥品主檔維護
          </a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link text-danger" onclick="logout()">
            <i class="bi bi-box-arrow-right me-2"></i> 登出
          </a>
        </li>
      </ul>
    </div>

<!-- 右側主內容區 -->
    <div class="main-content p-4">
      
      <!-- 視圖 1: 總覽首頁 (維持不變) -->
      <div id="view-overview" class="view-section">
        <div class="d-flex justify-content-between align-items-end mb-4 border-bottom pb-2">
          <h3 class="text-dark fw-bold mb-0">全院藥品總覽儀表板</h3>
          <div class="d-flex gap-2">
            <select id="overview-drug-filter" class="form-select form-select-sm" style="width: auto;">
              <option value="ALL">全部藥品</option>
            </select>
            <input type="date" id="overview-date-start" class="form-control form-control-sm" style="width: auto;">
            <span class="align-self-center text-muted">至</span>
            <input type="date" id="overview-date-end" class="form-control form-control-sm" style="width: auto;">
            <button class="btn btn-sm btn-secondary" onclick="renderOverview()">查詢</button>
          </div>
        </div>
        <div id="overview-content"></div>
      </div>

      <!-- 視圖 2: 單一藥品主頁面 (版面大幅優化) -->
      <div id="view-drug-dashboard" class="view-section d-none-important">
        
        <!-- 頂部區塊：標題與全局篩選器 -->
        <div class="d-flex justify-content-between align-items-start mb-3 border-bottom pb-3">
          <div>
            <h3 id="current-drug-title" class="text-primary fw-bold mb-3">-- 藥品儀表板 --</h3>
            <!-- 按鈕移至標題下方 -->
            <div class="d-flex gap-3">
              <button class="btn btn-primary btn-lg shadow-sm" onclick="openApplicationForm()">
                <i class="bi bi-pencil-square"></i> 填寫申請單
              </button>
              <button class="btn btn-success btn-lg shadow-sm" onclick="openDispenseForm()">
                <i class="bi bi-upc-scan"></i> 調劑剩餘量檢核
              </button>
            </div>
          </div>
          
          <!-- 右上角：控制整個頁面的時間篩選器 -->
          <div class="card shadow-sm border-0 bg-light">
            <div class="card-body p-2 d-flex gap-2">
              <span class="align-self-center text-muted small fw-bold"><i class="bi bi-calendar3"></i> 區間查詢</span>
              <input type="date" id="single-drug-date-start" class="form-control form-control-sm" style="width: auto;">
              <span class="align-self-center text-muted">-</span>
              <input type="date" id="single-drug-date-end" class="form-control form-control-sm" style="width: auto;">
              <button class="btn btn-sm btn-secondary" onclick="refreshSingleDrugDashboard()">查詢</button>
            </div>
          </div>
        </div>
        
        <!-- 單一藥品統計數據與圖表 -->
        <div id="drug-dashboard-stats" class="mb-4"></div>

        <!-- 紀錄查詢區塊 -->
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold">近期作業紀錄</h5>
            <div class="d-flex gap-2">
              <select id="single-drug-record-type" class="form-select form-select-sm" style="width: auto;">
                <option value="ALL">全部紀錄</option>
                <option value="APP">僅顯示申請單</option>
                <option value="DIS">僅顯示調劑/退藥</option>
              </select>
            </div>
          </div>
          <div class="card-body">
            <!-- 這裡未來會用 JS 把後端的資料生出來 -->
            <div class="text-center text-muted py-4" id="single-drug-records-table">報表資料串接中...</div>
          </div>
        </div>
      </div>

      <!-- 視圖 3: 填寫申請單 (預留) -->
      <div id="view-application" class="view-section d-none-important">
        <button class="btn btn-sm btn-secondary mb-3" onclick="switchView('drug-dashboard')"><i class="bi bi-arrow-left"></i> 返回藥品首頁</button>
        <h3 class="mb-4 text-primary fw-bold">📝 填寫申請單</h3>
        <div class="card shadow-sm p-4" id="application-container">
          <!-- 稍後整合 application.html 內容 -->
        </div>
      </div>

      <!-- 視圖 4: 調劑作業 (預留) -->
      <div id="view-dispense" class="view-section d-none-important">
        <button class="btn btn-sm btn-secondary mb-3" onclick="switchView('drug-dashboard')"><i class="bi bi-arrow-left"></i> 返回藥品首頁</button>
        <h3 class="mb-4 text-success fw-bold">💊 調劑剩餘量檢核</h3>
        <div id="dispense-container">
          <!-- 稍後整合 dispense.html 內容 -->
        </div>
      </div>

      <!-- 視圖 5: 藥品主檔維護 (修復區塊) -->
      <div id="view-drug-manage" class="view-section d-none-important">
        <h3 class="mb-4 text-secondary fw-bold">⚙️ 藥品主檔維護</h3>
        <div class="card shadow-sm p-4" id="drug-manage-container">
           <!-- 將您之前寫的 drug_manage.html 的內容直接貼在這裡面 -->
           <h5 class="text-muted">（請將 drug_manage.html 的表單與表格區塊貼至此處）</h5>
        </div>
      </div>

    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
